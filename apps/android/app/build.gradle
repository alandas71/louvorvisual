apply plugin: 'com.android.application'
apply plugin: 'org.jetbrains.kotlin.android'

android {
    namespace 'br.org.louvorvisual.projector'
    compileSdk 37

    defaultConfig {
        applicationId 'br.org.louvorvisual.projector'
        minSdk 23
        targetSdk 37
        versionCode 2
        versionName '0.2.0-phone'
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        // A origem da API é do host, nunca é entregue ao bundle do WebView.
        // Origem oficial do PWA. Um build de ambiente pode sobrescrevê-la com
        // -PlouvorvisualApiBaseUrl=https://... sem expor a configuração ao bundle.
        def apiBaseUrl = project.findProperty('louvorvisualApiBaseUrl') ?: 'https://louvorvisual.giize.com'
        buildConfigField 'String', 'API_BASE_URL', "\"${apiBaseUrl.replace('\\', '\\\\').replace('\"', '\\\"')}\""
    }

    buildFeatures { buildConfig true }

    buildTypes {
        debug {
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            // A chave de produção não pertence ao repositório. O APK controlado
            // desta etapa é o debug assinado pelo certificado de teste do SDK.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions { jvmTarget = '17' }

    androidResources {
        // O padrão do aapt descarta pastas de assets que começam com "_", e a
        // exportação do Next guarda todos os chunks em "_next/". Mantém as demais
        // exclusões do padrão e tira só essa.
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }
}

// O APK não embute uma segunda versão do aplicativo. Ele abre somente o
// receptor remoto do PWA oficial, portanto não carrega biblioteca, importação
// ou telas de controle como assets locais.

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'org.nanohttpd:nanohttpd:2.3.1'
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-common:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}

// A chave fica fora do repositório. Sem este arquivo, o release continua
// identificável apenas como build de teste (assinatura debug).
def signingProperties = new Properties()
def signingFile = rootProject.file('keystore.properties')
if (signingFile.exists()) {
    signingFile.withInputStream { signingProperties.load(it) }
    android.signingConfigs.create('production') {
        storeFile rootProject.file(signingProperties.getProperty('storeFile'))
        storePassword signingProperties.getProperty('storePassword')
        keyAlias signingProperties.getProperty('keyAlias')
        keyPassword signingProperties.getProperty('keyPassword')
    }
    android.buildTypes.release.signingConfig android.signingConfigs.production
}

// Um APK release assinado com a chave debug não é distribuível nem atualizável
// sobre uma instalação de produção. Falhar cedo evita produzir esse artefato por
// engano quando o cofre de chaves não foi montado no agente de build.
tasks.register('verifyReleaseSigning') {
    onlyIf { gradle.startParameter.taskNames.any { it.toLowerCase().contains('release') } }
    doLast {
        if (!signingFile.exists()) {
            throw new GradleException('keystore.properties é obrigatório para builds release; use assembleDebug para testes locais.')
        }
    }
}
// Algumas versões do Android Gradle Plugin não expõem preReleaseBuild; ligar a
// guarda aos tasks release evita depender de um nome interno do plugin.
tasks.configureEach {
    if (name.toLowerCase().contains('release') && name != 'verifyReleaseSigning') {
        dependsOn(tasks.named('verifyReleaseSigning'))
    }
}
