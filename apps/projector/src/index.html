<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>LouvorVisual</title>
    <style>
      @font-face { font-family: "Louvor Inter"; src: url("fonts/inter-400.woff2") format("woff2"); font-weight: 400; font-display: block; }
      @font-face { font-family: "Louvor Inter"; src: url("fonts/inter-700.woff2") format("woff2"); font-weight: 700; font-display: block; }
      :root { color-scheme: dark; background: #101217; color: #f5f7fb; font-family: "Louvor Inter", sans-serif; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(circle at 50% 20%, #27315a, #101217 60%); }
      main { width: min(88vw, 1500px); text-align: center; }
      .eyebrow { color: #b9c7ff; font-size: clamp(14px, 1.8vw, 28px); font-weight: 700; letter-spacing: .13em; text-transform: uppercase; }
      h1 { font-size: clamp(44px, 8vw, 142px); line-height: 1.12; margin: .5em 0 .2em; }
      p { font-size: clamp(20px, 2.5vw, 38px); color: #d7dbea; }
      #status { min-height: 1.4em; color: #b9c7ff; }
      .controls { opacity: 0; transition: opacity .2s; font-size: clamp(16px, 1.5vw, 24px); }
      .controls.visible { opacity: 1; }
    </style>
  </head>
  <body>
    <main aria-live="polite">
      <div class="eyebrow">LouvorVisual · prova Android offline</div>
      <h1 id="slide">Tudo tem o seu tempo</h1>
      <p id="verse">E há tempo para todo propósito debaixo do céu.</p>
      <p id="status">Slide 1 de 2 · fonte local embarcada</p>
      <p id="controls" class="controls">OK: controles · Voltar: fechar controles</p>
    </main>
    <script>
      (() => {
        const slides = [['Tudo tem o seu tempo', 'E há tempo para todo propósito debaixo do céu.'], ['O Senhor é a minha luz', 'A quem temerei?']];
        let current = 0; let controls = false; let commands = 0;
        const slide = document.querySelector('#slide'); const verse = document.querySelector('#verse');
        const status = document.querySelector('#status'); const controlsNode = document.querySelector('#controls');
        function render() { slide.textContent = slides[current][0]; verse.textContent = slides[current][1]; status.textContent = `Slide ${current + 1} de ${slides.length} · fonte local embarcada · comandos: ${commands}`; controlsNode.classList.toggle('visible', controls); }
        window.addEventListener('louvorvisual-command', (event) => {
          switch (event.detail && event.detail.command) { case 'previous': current = Math.max(0, current - 1); break; case 'next': current = Math.min(slides.length - 1, current + 1); break; case 'confirm': controls = !controls; break; case 'back': controls = false; break; default: return; }
          commands += 1; render();
        });
        render();
      })();
    </script>
  </body>
</html>
