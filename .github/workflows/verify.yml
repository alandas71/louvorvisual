name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: LouvorVisual_CI_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'LouvorVisual_CI_2026!' -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -C -S localhost -U sa -P 'LouvorVisual_CI_2026!' -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: "sqlserver://localhost:1433;database=LouvorVisual;user=sa;password=LouvorVisual_CI_2026!;encrypt=true;trustServerCertificate=true"
      LV_E2E_DATABASE_URL: "sqlserver://localhost:1433;database=LouvorVisual;user=sa;password=LouvorVisual_CI_2026!;encrypt=true;trustServerCertificate=true"
      BACKEND_URL: http://127.0.0.1:3121
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:deploy --workspace @louvorvisual/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  android-debug:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: ./gradlew testDebugUnitTest assembleDebug
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: louvorvisual-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
