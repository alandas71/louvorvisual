name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: LouvorVisual
          MYSQL_USER: louvorvisual
          MYSQL_PASSWORD: LouvorVisual_CI_2026!
          MYSQL_ROOT_PASSWORD: LouvorVisual_Root_2026!
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h localhost -u louvorvisual -pLouvorVisual_CI_2026!"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: "mysql://louvorvisual:LouvorVisual_CI_2026!@localhost:3306/LouvorVisual"
      LV_E2E_DATABASE_URL: "mysql://louvorvisual:LouvorVisual_CI_2026!@localhost:3306/LouvorVisual"
      BACKEND_URL: http://127.0.0.1:3121
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:deploy --workspace @louvorvisual/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
  android-debug:
    runs-on: ubuntu-latest
    needs: node
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: ./gradlew testDebugUnitTest assembleDebug
        working-directory: apps/android
      - uses: actions/upload-artifact@v4
        with:
          name: louvorvisual-debug-apk
          path: apps/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
